services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: amidog
      POSTGRES_USER: amidog
      POSTGRES_PASSWORD: amidog-local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amidog -d amidog"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - amidog-postgres:/var/lib/postgresql/data
  mailpit:
    image: axllent/mailpit:v1.30.0
    ports:
      - "1025:1025"
      - "8025:8025"
volumes:
  amidog-postgres:
